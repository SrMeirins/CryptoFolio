# Incluido en cada location que también define su propio add_header (p. ej.
# Cache-Control): en nginx, add_header a nivel "server" NO se hereda cuando
# un location ya tiene los suyos propios (no se combinan, se sustituyen) —
# por eso estas líneas viven en su propio fichero y se incluyen explícitamente
# en cada location, no solo una vez a nivel server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
