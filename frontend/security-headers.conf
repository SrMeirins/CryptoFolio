# Incluido en cada location que también define su propio add_header (p. ej.
# Cache-Control): en nginx, add_header a nivel "server" NO se hereda cuando
# un location ya tiene los suyos propios (no se combinan, se sustituyen) —
# por eso estas líneas viven en su propio fichero y se incluyen explícitamente
# en cada location, no solo una vez a nivel server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
# Inocua sobre HTTP puro (el navegador solo la aplica sobre HTTPS) — lista para
# cuando haya TLS delante (túnel/VPN). Sin includeSubDomains: no hay
# subdominios propios que controlar todavía.
add_header Strict-Transport-Security "max-age=63072000" always;
# Aislamiento cross-origin: la app no abre ni es embebida en popups/iframes de
# otros orígenes. Si un futuro rediseño de autenticación necesita un popup
# OAuth cross-origin, revisar COOP entonces (puede romper window.opener).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
