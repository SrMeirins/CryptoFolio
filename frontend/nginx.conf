# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — servido estático del frontend en modo producción.
#
# Solo se usa con Dockerfile.prod (servicio opcional frontend-prod, perfil
# 'prod' de docker-compose). El frontend de desarrollo (Dockerfile + Vite
# dev server) NO usa este fichero.
# ─────────────────────────────────────────────────────────────────────────────
server {
    # nginx-unprivileged escucha en 8080 (no root, no puede bindear <1024).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # connect-src 'self' basta: el proxy /api y /ws de aquí mismo son
    # same-origin para el navegador (nginx reenvía internamente al backend).
    # Ver security-headers.conf: se incluye también dentro de cada location
    # que define su propio add_header, porque nginx no los hereda en ese caso.
    include /etc/nginx/security-headers.conf;
    server_tokens off;

    # Assets con hash de contenido en el nombre (Vite): cacheables para siempre.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta que no sea un fichero real cae a index.html
    # (React Router gestiona el resto client-side). index.html nunca se
    # cachea, para que un nuevo deploy se vea sin purgar caché a mano.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Mismo proxy que el dev server de Vite (vite.config.ts): la SPA llama a
    # /api y /ws relativos, nginx los reenvía al backend por la red interna.
    location /api/ {
        # Debe igualar el límite real del backend (backend/src/app.ts,
        # express.json({ limit: '10mb' })) — el valor por defecto de nginx
        # (1m) es más bajo y rechazaría con 413 un import de CSV grande
        # antes de que llegue al backend.
        client_max_body_size 10m;
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El import de CSV responde con un stream SSE que puede durar varios
        # minutos (precios históricos con backoff de CoinGecko). A diferencia
        # del proxy de Vite (timeout:0 = sin límite), en nginx 0 NO desactiva
        # el timeout — lo deja casi inmediato (verificado: 504 instantáneo).
        # Se usa un valor alto en su lugar, y se desactiva el buffering para
        # que los eventos del stream lleguen sin retenerse hasta llenar el
        # buffer interno de nginx.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # El backend expone el WS en /ws/prices (routes/prices.ts); el prefijo
    # /ws/ cubre esa ruta igual que el proxy del dev server de Vite.
    location /ws/ {
        proxy_pass http://backend:3001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
