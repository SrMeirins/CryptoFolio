# ─────────────────────────────────────────────────────────────────────────────
# CryptoFolio — stack de PRODUCCIÓN (self-hosted)
#
# Este es el fichero que debe usar cualquier usuario final (ver README.md,
# sección de instalación). Arranque: `docker compose up -d`.
#
# Diferencias con docker-compose.dev.yml (uso interno del equipo, nunca
# recomendado a usuarios): aquí el backend corre el build compilado real
# (Dockerfile, no Dockerfile.dev) y el frontend es el build de producción
# servido por nginx (Dockerfile.prod) — nunca el dev server de Vite. Solo el
# frontend expone un puerto al host; Postgres y el backend son alcanzables
# únicamente dentro de la red interna de Docker (nginx reenvía /api y /ws al
# backend) — menor superficie expuesta que en el stack de dev.
#
# Variables obligatorias: POSTGRES_PASSWORD (el arranque falla con un
# mensaje claro si falta — ver la sintaxis ${VAR:?...} más abajo). Todo lo
# demás es opcional, con valores por defecto sensatos. Ver .env.example.
#
# Endurecimiento (mismo criterio que el stack de dev, ver su cabecera):
# redes segmentadas, cap_drop: ALL + no-new-privileges en todos los
# servicios, rootfs de solo lectura en postgres/backend/frontend/db-backup
# (verificado con el stack real: todos arrancan y funcionan igual con el
# sistema de ficheros del contenedor en modo lectura, salvo los volúmenes/
# tmpfs explícitamente montados), logs con límite de tamaño (evita llenar
# el disco en un self-host que corre desatendido durante meses).
# ─────────────────────────────────────────────────────────────────────────────
name: cryptofolio

# Límite de logs para todos los servicios — Docker no limita el driver
# json-file por defecto, y un stack que corre meses sin supervisión puede
# llenar el disco solo con logs. 10MB x 3 ficheros = 30MB máx. por servicio.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptotracker}
      # Sin fallback inseguro: si no defines POSTGRES_PASSWORD en tu .env, el
      # arranque falla aquí mismo con este mensaje, no arranca con una
      # contraseña por defecto conocida.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu .env (copia .env.example primero)}
      POSTGRES_DB: ${POSTGRES_DB:-cryptotracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    # Sin mapeo de puerto al host: no hace falta alcanzar Postgres desde fuera
    # del stack. Acceso puntual vía `docker compose exec postgres psql ...`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptotracker} -d ${POSTGRES_DB:-cryptotracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # El entrypoint oficial arranca como root y hace chown/chmod del volumen
    # de datos antes de bajar privilegios — sin estas 3 capabilities,
    # initdb falla (verificado en el stack de dev). El proceso postgres en
    # sí, una vez arrancado, corre sin privilegios (CapEff=0).
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # Rootfs de solo lectura — verificado con el stack real: Postgres solo
    # necesita escribir en su volumen de datos (ya montado aparte) y en
    # /tmp / el socket Unix, cubiertos por tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    logging: *default-logging

  # ── Backend Node.js (build de producción real) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cryptotracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptotracker}}
      BACKEND_PORT: "3001"
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      PRICE_REFRESH_INTERVAL_MS: ${PRICE_REFRESH_INTERVAL_MS:-60000}
      # Verificación de saldos on-chain (backend/src/modules/walletSync) —
      # todo opcional: sin WALLET_SYNC_ENCRYPTION_KEY, el resto de la app
      # funciona con normalidad; solo falla si intentas guardar una API key
      # de red on-chain sin haberla definido antes.
      WALLET_SYNC_ENCRYPTION_KEY: ${WALLET_SYNC_ENCRYPTION_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      BLOCKFROST_API_KEY: ${BLOCKFROST_API_KEY:-}
      SUBSCAN_API_KEY: ${SUBSCAN_API_KEY:-}
    # Sin bind-mounts de código ni mapeo de puerto al host: el frontend
    # (nginx) es el único punto de entrada, y reenvía /api y /ws aquí por la
    # red interna.
    volumes:
      - csv_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend-net
      - frontend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Rootfs de solo lectura — verificado con el stack real (build compilado,
    # sin ts-node-dev ni bind-mounts de código): el único directorio en el
    # que escribe de verdad es /app/uploads, ya cubierto por el volumen.
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  # ── Frontend (build de producción real, servido por nginx) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Único puerto expuesto al host de todo el stack. Ligado a 127.0.0.1
      # por defecto — la app hoy no tiene autenticación (ver hallazgo
      # aplazado en el tracking de auditoría), así que no se recomienda
      # exponerla directamente a la red sin un reverse proxy con su propia
      # autenticación delante.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    healthcheck:
      # nginx-unprivileged trae wget/curl (verificado) — antes este servicio
      # no tenía healthcheck propio, solo dependía de que el backend
      # estuviera sano; con esto se detecta también si nginx mismo se cae.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging: *default-logging

  # ── Backup automático de PostgreSQL ─────────────────────────────────────────
  # pg_dump comprimido semanal, con retención por cantidad de ficheros. Ver
  # scripts/backup-loop.sh. Para un backup manual inmediato:
  # `docker compose exec -T postgres pg_dump -U ... | gzip > backup.sql.gz`
  #
  # BACKUP_HOST_DIR: fuera del repo a propósito (antes era ./backups, dentro
  # del checkout de git) — directorio estándar de datos de aplicación del
  # usuario, no algo que deba vivir junto al código fuente. Default pensado
  # para Linux/Docker Desktop vía WSL2 (~/.local/share/CryptoFolio/backups,
  # convención XDG); en macOS/Windows nativo puedes sobreescribirlo en tu
  # .env con la ruta que prefieras.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-cryptotracker}
      PGPASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu .env (copia .env.example primero)}
      PGDATABASE: ${POSTGRES_DB:-cryptotracker}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-14}
    # Corre como el usuario real del host (no root) — HOST_UID/HOST_GID en
    # tu .env (`id -u` / `id -g`). Revisión de seguridad detectó que la
    # solución anterior (DAC_OVERRIDE permanente + chmod 777 en
    # backup-loop.sh) dejaba los backups — datos financieros reales —
    # legibles y escribibles por CUALQUIER usuario de la máquina, no solo
    # por este proceso. Verificado empíricamente que pg_dump funciona igual
    # de bien con un UID arbitrario sin entrada en /etc/passwd — no hace
    # falta root en ningún momento del ciclo de vida de este servicio.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${BACKUP_HOST_DIR:-~/.local/share/CryptoFolio/backups}:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  # ── pgAdmin (opcional: docker compose --profile tools up -d) ───────────────
  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cryptofolio.app
      # Sin :? aquí a propósito: es un servicio de perfil opcional y Docker
      # Compose evalúa las variables de TODOS los servicios al parsear el
      # fichero, incluso los de perfiles inactivos — un :? aquí rompería
      # `docker compose up -d` para todo el mundo, use o no pgAdmin
      # (verificado empíricamente). Fallback solo para este caso opcional.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-cambia_esto_si_usas_pgadmin}
    volumes:
      # Sin esto, pgAdmin pierde TODAS las conexiones/sesiones guardadas
      # cada vez que se recrea el contenedor — /var/lib/pgadmin es donde
      # guarda su SQLite de sesiones y el árbol de servidores (verificado
      # en config.py de la imagen: DATA_DIR = /var/lib/<app>).
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
  csv_uploads:
    driver: local
  pgadmin_data:
    driver: local

networks:
  backend-net:
  frontend-net:
