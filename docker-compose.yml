version: '3.9'

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cryptotracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema inicial se ejecuta automáticamente al crear el contenedor
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      # Solo expuesto localmente para poder conectar con DBeaver/psql si necesitas
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend Node.js ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cryptotracker_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      PRICE_REFRESH_INTERVAL_MS: ${PRICE_REFRESH_INTERVAL_MS:-60000}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      # Hot reload en desarrollo
      - ./backend/src:/app/src:ro
      # Carpeta para subida de CSVs (persiste entre reinicios)
      - csv_uploads:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend React ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cryptotracker_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001}
    volumes:
      # Hot reload: montar src del host para que Vite sirva siempre el código actual
      - ./frontend/src:/app/src
    ports:
      - "127.0.0.1:5173:5173"

  # ── pgAdmin (opcional, para inspeccionar la DB visualmente) ───────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cryptotracker_pgadmin
    restart: unless-stopped
    profiles:
      # Solo arranca si haces: docker compose --profile tools up
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cryptotracker.local
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  csv_uploads:
    driver: local
