<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Fondo: negro azulado → índigo profundo -->
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#050A18"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Barras: índigo → violeta claro -->
    <linearGradient id="barA" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="barC" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Línea de tendencia: índigo → cian -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Halo del punto peak -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip de la zona de barras -->
    <clipPath id="chartArea">
      <rect x="20" y="20" width="160" height="150"/>
    </clipPath>
  </defs>

  <!-- ── FONDO ─────────────────────────────────────────── -->
  <rect width="200" height="200" rx="38" fill="url(#bg)"/>

  <!-- Sutil borde interior de profundidad -->
  <rect width="200" height="200" rx="38"
        fill="none" stroke="white" stroke-width="1" opacity="0.04"/>

  <!-- Hexágono fantasma: marca "cripto" sin copiarlo -->
  <polygon
    points="100,16 152,46 152,106 100,136 48,106 48,46"
    fill="none" stroke="#6366F1" stroke-width="1" opacity="0.07"/>

  <!-- Líneas de cuadrícula horizontales (muy sutiles) -->
  <line x1="24" y1="70"  x2="176" y2="70"  stroke="white" stroke-width="0.5" opacity="0.05"/>
  <line x1="24" y1="105" x2="176" y2="105" stroke="white" stroke-width="0.5" opacity="0.05"/>
  <line x1="24" y1="140" x2="176" y2="140" stroke="white" stroke-width="0.5" opacity="0.05"/>

  <!-- ── BARRAS ASCENDENTES ─────────────────────────────── -->
  <!-- Barra 1 (izquierda, más baja) -->
  <rect x="26" y="108" width="36" height="60" rx="6" fill="url(#barA)" opacity="0.80"/>
  <!-- Barra 2 (centro) -->
  <rect x="76" y="78"  width="36" height="90" rx="6" fill="url(#barB)" opacity="0.90"/>
  <!-- Barra 3 (derecha, más alta) -->
  <rect x="126" y="44" width="36" height="124" rx="6" fill="url(#barC)"/>

  <!-- ── LÍNEA DE TENDENCIA ─────────────────────────────── -->
  <polyline
    points="44,103  94,73  144,39"
    stroke="url(#lineGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.95"
  />

  <!-- ── PUNTO PEAK (valor actual) ──────────────────────── -->
  <!-- Halo exterior -->
  <circle cx="144" cy="39" r="20" fill="url(#halo)"/>
  <!-- Círculo principal -->
  <circle cx="144" cy="39" r="9"  fill="#22D3EE"/>
  <!-- Núcleo blanco -->
  <circle cx="144" cy="39" r="4.5" fill="white"/>

  <!-- ── DESTELLO (sparkle) ─────────────────────────────── -->
  <!-- Línea horizontal del destello -->
  <line x1="130" y1="25" x2="158" y2="25" stroke="white" stroke-width="1.2" opacity="0.18"/>
  <!-- Línea vertical del destello -->
  <line x1="144" y1="11" x2="144" y2="39" stroke="white" stroke-width="1.2" opacity="0.12"/>
</svg>
