name: Lint & typecheck (reusable)

on:
  workflow_call:

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Dos rutas que solo cambian en mayúsculas rompen el checkout y los
      # imports en Windows y macOS (versión 1.0): se detecta antes de compilar.
      - name: Rutas sin colisiones de mayúsculas y scripts del repositorio
        run: |
          node --test scripts/check-case-collisions.test.mjs scripts/demo/cartera.test.mjs
          node scripts/check-case-collisions.mjs

      - name: Backend — install, lint, typecheck
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Frontend — install, lint, typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
