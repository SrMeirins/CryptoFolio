name: Lint & typecheck (reusable)

on:
  workflow_call:

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Backend — install, lint, typecheck
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Frontend — install, lint, typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
