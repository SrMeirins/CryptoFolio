name: Build de prueba (Windows)

# Disparo manual desde GitHub Actions → pestaña "Actions" → "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    uses: ./.github/workflows/_lint.yml

  build-win:
    name: Build Windows (.exe)
    needs: lint
    uses: ./.github/workflows/_build.yml
    with:
      os: windows-latest
      platform: win
      publish: false
    secrets: inherit
