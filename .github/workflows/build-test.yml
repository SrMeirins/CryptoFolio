name: Build de prueba (Windows)

# Disparo manual desde GitHub Actions → pestaña "Actions" → "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            electron/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:3001
          VITE_WS_URL: ws://127.0.0.1:3001
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Install Electron deps
        working-directory: electron
        run: npm ci

      - name: Build Electron TS
        working-directory: electron
        run: npm run build

      - name: Package (sin publicar)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:local

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CryptoFolio-win-test-${{ github.sha }}
          path: releases/*.exe
          retention-days: 7
