name: CI

# Único workflow que corre automáticamente en cada push/PR a main — antes de
# esto, ningún workflow se disparaba solo (build-test.yml es manual,
# release.yml solo al taguear) y ninguno ejecutaba la suite de tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & typecheck
    uses: ./.github/workflows/_lint.yml

  lint-electron:
    name: Lint & typecheck — electron
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install, lint, typecheck
        working-directory: electron
        # --legacy-peer-deps: bug conocido del resolver de npm con este árbol
        # de dependencias (electron-builder + vitest) — sin él, "npm ci"
        # falla con "Missing: ... from lock file" pese a que el lockfile es
        # correcto (reproducido también en local, no es un problema del CI).
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run typecheck

  test-backend:
    name: Tests — backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptotracker
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Test
        working-directory: backend
        # createTestDatabase() (backend/src/test/setup-test-db.ts) crea una
        # base de datos Postgres aislada por test file contra esta conexión
        # de mantenimiento — mismo mecanismo que se usa en local.
        env:
          DATABASE_URL: postgresql://cryptotracker:ci_test_password@localhost:5432/postgres
        run: npm test

  test-frontend:
    name: Tests — frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

  test-electron:
    name: Tests — electron
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install
        working-directory: electron
        run: npm ci --legacy-peer-deps

      - name: Test
        working-directory: electron
        run: npm test
