name: CI

# Único workflow que corre automáticamente en cada push/PR a main — antes de
# esto, ningún workflow se disparaba solo (build-test.yml es manual,
# release.yml solo al taguear) y ninguno ejecutaba la suite de tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A mano desde Actions (por ejemplo, para pasar el smoke en una rama).
  workflow_dispatch:

permissions:
  contents: read

# Repositorio privado (cuota de minutos): una ejecución nueva de la misma rama
# o PR cancela la anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    uses: ./.github/workflows/_lint.yml

  lint-electron:
    name: Lint & typecheck — electron
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install, lint, typecheck
        working-directory: electron
        # --legacy-peer-deps: bug conocido del resolver de npm con este árbol
        # de dependencias (electron-builder + vitest) — sin él, "npm ci"
        # falla con "Missing: ... from lock file" pese a que el lockfile es
        # correcto (reproducido también en local, no es un problema del CI).
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run typecheck

  audit:
    name: Auditoría de dependencias — ${{ matrix.package }}
    # Falla ante vulnerabilidades altas o críticas en dependencias de
    # producción (#203) y, desde #355, también en las de desarrollo: una
    # vulnerabilidad en la cadena de herramientas (vite, el servidor de
    # desarrollo) afecta a quien trabaja en el repo. Además, toda dependencia
    # debe declararse con versión exacta. La raíz (#368) solo tiene
    # herramientas de desarrollo (markdownlint-cli2).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: backend,  dir: backend }
          - { package: frontend, dir: frontend }
          - { package: electron, dir: electron }
          - { package: raíz,     dir: . }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Como npm audit --audit-level=high, con excepciones temporales
      # documentadas y caducables en scripts/audit-exceptions.json (#384).
      - name: Tests del script de auditoría
        run: node --test scripts/audit.test.mjs

      - name: npm audit (producción)
        working-directory: ${{ matrix.dir }}
        run: node "$GITHUB_WORKSPACE/scripts/audit.mjs" --omit=dev

      - name: npm audit (desarrollo)
        working-directory: ${{ matrix.dir }}
        run: node "$GITHUB_WORKSPACE/scripts/audit.mjs"

      - name: Versiones exactas
        run: node scripts/check-exact-versions.mjs ${{ matrix.dir }}/package.json

  test-backend:
    name: Tests — backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptotracker
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Test
        working-directory: backend
        # createTestDatabase() (backend/src/test/setup-test-db.ts) crea una
        # base de datos Postgres aislada por test file contra esta conexión
        # de mantenimiento — mismo mecanismo que se usa en local.
        env:
          DATABASE_URL: postgresql://cryptotracker:ci_test_password@localhost:5432/postgres
        run: npm test

  test-frontend:
    name: Tests — frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

  smoke-console:
    name: Smoke — consola del navegador
    # Repositorio privado (cuota de minutos): el smoke (unos 22 minutos) corre
    # en main y a mano, no en cada PR; antes de cada push ya se pasa la suite
    # e2e completa en local.
    if: github.event_name != 'pull_request'
    # Prueba de humo (#201): backend real con datos sintéticos + frontend en
    # modo desarrollo (React solo emite sus avisos ahí) + Playwright, que abre
    # cada vista y falla ante cualquier error o aviso en la consola.
    # Corre en la imagen oficial de Playwright (#602): Chromium y sus librerías
    # del sistema ya vienen instalados, así que el job no depende de apt ni de
    # los repositorios de Ubuntu. La etiqueta, con versión exacta, debe
    # coincidir con @playwright/test (lo comprueba el primer paso).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptotracker
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dentro del contenedor, Postgres se alcanza por el nombre del servicio.
      DATABASE_URL: postgresql://cryptotracker:ci_test_password@postgres:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Comprobar la versión de la imagen de Playwright
        run: |
          node --test scripts/ci/check-playwright-image.test.mjs scripts/ci/run-sql.test.mjs
          node scripts/ci/check-playwright-image.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install
        # Red de seguridad (#602): tres intentos con espera creciente ante un
        # fallo de red del registro de npm.
        run: |
          for intento in 1 2 3; do
            npm ci --prefix backend && npm ci --prefix frontend && exit 0
            echo "npm ci falló (intento $intento de 3)"
            [ "$intento" -lt 3 ] && sleep $((intento * 20))
          done
          exit 1

      - name: Start backend
        # El backend aplica schema.sql y las migraciones sobre la base vacía al
        # arrancar. Modo sin red (#359): no consulta APIs de precios (los
        # cierres sintéticos vienen en el seed) y la prueba no depende de
        # terceros. tsx es la devDependency pinada (antes `npx ts-node`, que se
        # descargaba sin versión fija). La espera usa fetch de Node: la imagen
        # no garantiza curl.
        working-directory: backend
        env:
          BACKEND_PORT: '3001'
          BACKEND_HOST: 127.0.0.1
          PRICE_SOURCES_OFFLINE: 'true'
          # La suite e2e completa supera las 5000 peticiones por ventana del valor por defecto.
          RATE_LIMIT_MAX: '50000'
        run: |
          nohup npx tsx src/index.ts > backend.log 2>&1 &
          for i in $(seq 1 60); do
            node -e "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0
            sleep 2
          done
          cat backend.log; exit 1

      - name: Seed synthetic data
        # seed.sql con el paquete pg del backend: la imagen no trae psql.
        run: |
          node scripts/ci/run-sql.mjs frontend/e2e/seed.sql
          node -e "fetch('http://127.0.0.1:3001/api/fifo/run', { method: 'POST', signal: AbortSignal.timeout(300000) }).then(r => { console.log('FIFO:', r.status); process.exit(r.ok ? 0 : 1) }, e => { console.error(e.message); process.exit(1) })"

      - name: Console smoke test
        working-directory: frontend
        env:
          BACKEND_PROXY_HOST: 127.0.0.1:3001
        run: npm run test:e2e

      # Traza de Playwright y log del backend si falla (datos sintéticos, sin
      # secretos), para diagnosticar sin reproducir el entorno del runner.
      - name: Subir traza y log en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-console-${{ github.sha }}
          path: |
            frontend/test-results/
            backend/backend.log
          retention-days: 7

  test-electron:
    name: Tests — electron
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install
        working-directory: electron
        run: npm ci --legacy-peer-deps

      - name: Test
        working-directory: electron
        run: npm test
