name: Release

# Se dispara cuando se sube un tag con formato v1.2.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# GITHUB_TOKEN necesita permisos de escritura para crear el Release
permissions:
  contents: write

jobs:
  lint:
    name: Lint & typecheck
    uses: ./.github/workflows/_lint.yml

  # ── Pre-crear el draft ANTES de que los 3 builders arranquen ─────────────
  # Sin este job, cada builder intenta crear el draft al mismo tiempo y los
  # que llegan tarde ven "release doesn't exist" y pierden el upload.
  create-draft:
    name: Create draft release
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      # Extraer versión del tag (v1.2.3 → 1.2.3) para inyectarla en electron/package.json
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes "Building..." \
            --repo "${{ github.repository }}"

  build:
    name: Build — ${{ matrix.platform }}
    needs: create-draft          # espera a que el draft exista antes de subir

    strategy:
      fail-fast: false   # Si falla un OS, los otros siguen
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      publish: true
      version: ${{ needs.create-draft.outputs.version }}
    secrets: inherit

  # ── Publicar el draft solo cuando los 3 plataformas han subido sus assets ──
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No se encontró la sección '## [${VERSION}]' en CHANGELOG.md (o está vacía). Añade la entrada antes de publicar el release."
            exit 1
          fi

      - name: Publish draft → release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --notes-file release_notes.md \
            --repo "${{ github.repository }}"
