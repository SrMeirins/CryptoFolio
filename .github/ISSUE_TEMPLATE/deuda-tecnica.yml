name: Deuda técnica
description: Refactor, limpieza, tests o dependencias, sin cambio funcional visible
title: "[Deuda] "
labels: ["tipo/deuda-tecnica"]
projects: ["SrMeirins/1"]
body:
  - type: textarea
    id: situacion
    attributes:
      label: Situación actual
      description: Qué hay ahora y por qué es un problema (mantenimiento, rendimiento, riesgo…).
    validations:
      required: true

  - type: textarea
    id: ubicacion
    attributes:
      label: Dónde
      description: Ficheros o módulos afectados.
      placeholder: backend/src/modules/fifo/engine.ts
    validations:
      required: true

  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo se resolvería y cómo se valida (tests, lint, benchmark…).
    validations:
      required: true

  - type: dropdown
    id: impacto
    attributes:
      label: Impacto si no se aborda
      options:
        - Alto — puede provocar errores en datos o cálculos
        - Medio — frena el desarrollo o añade riesgo
        - Bajo — limpieza o estilo
    validations:
      required: true
