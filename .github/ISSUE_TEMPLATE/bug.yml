name: Bug
description: Algo no funciona como debería
title: "[Bug] "
labels: ["tipo/bug"]
projects: ["SrMeirins/1"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **Este repositorio es público**: no pegues datos reales (CSV, importes, direcciones de wallet, claves de API). Usa datos inventados o enmascarados.
        Si es un **fallo de seguridad**, no abras una issue: repórtalo en privado desde la pestaña *Security* (ver `SECURITY.md`).

  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasa
      description: Describe el problema en una o dos frases.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a…
        2. Pulsar…
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Dónde lo usas
      options:
        - Docker (self-hosted)
        - App de escritorio (Electron)
        - Entorno de desarrollo
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      description: Aparece en Ajustes → General o en el nombre del instalador.
      placeholder: v0.0.14

  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Opcional. Revisa que no contengan datos personales ni financieros.
      render: shell

  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad
      options:
        - label: He revisado que esta issue no contiene datos personales ni financieros reales.
          required: true
