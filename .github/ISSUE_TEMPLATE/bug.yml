name: Bug
description: Comportamiento incorrecto o inesperado de la aplicación
labels: ["tipo/bug"]
projects: ["SrMeirins/1"]
body:
  - type: markdown
    attributes:
      value: |
        **Repositorio público:** no incluyas datos reales (CSV, importes, direcciones de wallet, claves de API). Usa datos sintéticos o enmascarados.
        **Vulnerabilidades de seguridad:** no abras una issue; repórtalas en privado desde la pestaña *Security* (ver `SECURITY.md`).

  - type: textarea
    id: resumen
    attributes:
      label: Resumen
      description: Descripción concisa del defecto (una o dos frases).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      description: Versión publicada (Ajustes → General) o commit si es desarrollo.
      placeholder: v0.0.14 / main@c9aed6a
    validations:
      required: true

  - type: dropdown
    id: despliegue
    attributes:
      label: Despliegue
      options:
        - Docker (self-hosted)
        - Aplicación de escritorio (Electron)
        - Entorno de desarrollo
    validations:
      required: true

  - type: input
    id: plataforma
    attributes:
      label: Sistema operativo y navegador
      placeholder: Ubuntu 24.04 · Firefox 131

  - type: dropdown
    id: componentes
    attributes:
      label: Componentes afectados
      multiple: true
      options:
        - Backend / API
        - Interfaz web
        - Aplicación de escritorio
        - Fiscal (IRPF, Modelo 721, exportaciones)
        - Motor FIFO
        - Importación de CSV
        - Portfolio, precios y wallets
        - Infraestructura (Docker, CI/CD)
    validations:
      required: true

  - type: textarea
    id: precondiciones
    attributes:
      label: Precondiciones
      description: Estado necesario antes de reproducir (datos cargados, configuración…).
      placeholder: Existe al menos una wallet con transacciones importadas.

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      description: Impacto técnico del defecto. La prioridad se asigna al triar la issue.
      options:
        - Crítica — pérdida o corrupción de datos, o cálculo fiscal incorrecto
        - Alta — funcionalidad principal inoperativa sin alternativa
        - Media — funcionalidad afectada con alternativa disponible
        - Baja — defecto menor o estético
    validations:
      required: true

  - type: textarea
    id: evidencias
    attributes:
      label: Evidencias
      description: Logs, trazas o capturas. Revisa que no contengan datos personales ni financieros.
      render: shell

  - type: textarea
    id: analisis
    attributes:
      label: Análisis técnico
      description: Opcional. Causa raíz identificada, ficheros implicados.

  - type: textarea
    id: solucion
    attributes:
      label: Propuesta de solución
      description: Opcional.

  - type: textarea
    id: aceptacion
    attributes:
      label: Criterios de aceptación
      description: Condiciones verificables para dar el defecto por resuelto.
      value: |
        - [ ] El defecto no se reproduce siguiendo los pasos descritos.
        - [ ] Existe un test de regresión que cubre el caso.
    validations:
      required: true

  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que esta issue no contiene datos personales ni financieros reales.
          required: true
